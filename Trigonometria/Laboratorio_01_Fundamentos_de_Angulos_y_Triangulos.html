&lt;div class=&quot;inputRow&quot;&gt;&lt;input id=&quot;b&quot; max=&quot;15&quot; min=&quot;1&quot; step=&quot;0.1&quot; type=&quot;range&quot; value=&quot;8&quot;/&gt;&lt;input aria-label=&quot;Lado b&quot; id=&quot;bn&quot; max=&quot;15&quot; min=&quot;1&quot; step=&quot;0.1&quot; type=&quot;number&quot; value=&quot;8&quot;/&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;controlTop&quot;&gt;&lt;label for=&quot;c&quot;&gt;Lado c&lt;/label&gt;&lt;output id=&quot;cv&quot;&gt;9.0000&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;inputRow&quot;&gt;&lt;input id=&quot;c&quot; max=&quot;15&quot; min=&quot;1&quot; step=&quot;0.1&quot; type=&quot;range&quot; value=&quot;9&quot;/&gt;&lt;input aria-label=&quot;Lado c&quot; id=&quot;cn&quot; max=&quot;15&quot; min=&quot;1&quot; step=&quot;0.1&quot; type=&quot;number&quot; value=&quot;9&quot;/&gt;&lt;/div&gt;

&lt;div class=&quot;inputRow&quot;&gt;&lt;input id=&quot;Ain&quot; max=&quot;170&quot; min=&quot;5&quot; step=&quot;0.1&quot; type=&quot;range&quot; value=&quot;55&quot;/&gt;&lt;input aria-label=&quot;Ángulo A&quot; id=&quot;Ainn&quot; max=&quot;170&quot; min=&quot;5&quot; step=&quot;0.1&quot; type=&quot;number&quot; value=&quot;55&quot;/&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;control&quot;&gt;
&lt;div class=&quot;controlTop&quot;&gt;&lt;label for=&quot;Bin&quot;&gt;Ángulo B&lt;/label&gt;&lt;output id=&quot;Binv&quot;&gt;65.0000°&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;inputRow&quot;&gt;&lt;input id=&quot;Bin&quot; max=&quot;170&quot; min=&quot;5&quot; step=&quot;0.1&quot; type=&quot;range&quot; value=&quot;65&quot;/&gt;&lt;input aria-label=&quot;Ángulo B&quot; id=&quot;Binn&quot; max=&quot;170&quot; min=&quot;5&quot; step=&quot;0.1&quot; type=&quot;number&quot; value=&quot;65&quot;/&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;control&quot;&gt;
&lt;div class=&quot;controlTop&quot;&gt;&lt;label&gt;Ángulo C&lt;/label&gt;&lt;output id=&quot;Ccalc&quot;&gt;60.0000°&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;inputRow&quot;&gt;&lt;input disabled=&quot;&quot; type=&quot;range&quot; value=&quot;60&quot;/&gt;&lt;input aria-label=&quot;Ángulo C calculado&quot; disabled=&quot;&quot; id=&quot;Cnum&quot; type=&quot;number&quot; value=&quot;60&quot;/&gt;&lt;/div&gt;

&lt;div aria-label=&quot;Ejemplos rápidos&quot; class=&quot;preset&quot;&gt;

&lt;button data-preset=&quot;isosceles&quot; type=&quot;button&quot;&gt;Isósceles&lt;/button&gt;
&lt;button data-preset=&quot;scalene&quot; type=&quot;button&quot;&gt;Escaleno&lt;/button&gt;
&lt;button data-preset=&quot;right&quot; type=&quot;button&quot;&gt;Rectángulo&lt;/button&gt;
&lt;button data-preset=&quot;obtuse&quot; type=&quot;button&quot;&gt;Obtusángulo&lt;/button&gt;

&lt;h2&gt;Propiedades observadas&lt;/h2&gt;
&lt;p class=&quot;section-note&quot;&gt;Los resultados se agrupan por medidas, clasificación y verificación para facilitar su lectura.&lt;/p&gt;
&lt;div class=&quot;result-groups&quot;&gt;
&lt;div class=&quot;result-group&quot;&gt;
&lt;h3&gt;Medidas del triángulo&lt;/h3&gt;
&lt;div class=&quot;values grouped&quot;&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;span&gt;Lados a, b, c&lt;/span&gt;&lt;strong id=&quot;sides&quot;&gt;—&lt;/strong&gt;&lt;/div&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;span&gt;Ángulos A, B, C&lt;/span&gt;&lt;strong id=&quot;angles&quot;&gt;—&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;result-group&quot;&gt;
&lt;h3&gt;Clasificación y verificación&lt;/h3&gt;
&lt;div class=&quot;values grouped&quot;&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;span&gt;Por sus lados&lt;/span&gt;&lt;strong id=&quot;sideType&quot;&gt;—&lt;/strong&gt;&lt;/div&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;span&gt;Por sus ángulos&lt;/span&gt;&lt;strong id=&quot;angleType&quot;&gt;—&lt;/strong&gt;&lt;/div&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;span&gt;Perímetro&lt;/span&gt;&lt;strong id=&quot;perimeter&quot;&gt;—&lt;/strong&gt;&lt;/div&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;span&gt;Suma de ángulos&lt;/span&gt;&lt;strong id=&quot;sum&quot;&gt;—&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;math&quot;&gt;
&lt;div class=&quot;cap&quot;&gt;Condición de existencia&lt;/div&gt;
&lt;div class=&quot;expr&quot; id=&quot;ineq&quot;&gt;—&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;math&quot;&gt;
&lt;div class=&quot;cap&quot;&gt;Propiedad fundamental&lt;/div&gt;
&lt;div class=&quot;expr&quot; id=&quot;sumEq&quot;&gt;A + B + C = 180.0000°&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot; id=&quot;modeNote&quot;&gt;En este modo controlas las tres longitudes. El simulador verifica automáticamente la desigualdad triangular.&lt;/div&gt;

&lt;/main&gt;
&lt;script&gt;
(() =&gt; {
&#x27;use strict&#x27;;
const $ = id =&gt; document.getElementById(id);
const svg = $(&#x27;drawing&#x27;);
const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
const fmt = x =&gt; Number.isFinite(x) ? x.toLocaleString(&#x27;es-EC&#x27;,{minimumFractionDigits:4,maximumFractionDigits:4}) : &#x27;—&#x27;;
const clamp = (x,lo,hi) =&gt; Math.max(lo,Math.min(hi,x));
const deg = r =&gt; r*180/Math.PI;
const rad = d =&gt; d*Math.PI/180;
let mode = &#x27;sides&#x27;;

const state = {a:7,b:8,c:9,A:55,B:65};

function setPair(id, value){
  const r=$(id), n=$(id+&#x27;n&#x27;), out=$(id+&#x27;v&#x27;);
  value=clamp(Number(value),Number(r.min),Number(r.max));
  value=Math.round(value*10000)/10000;
  r.value=value; n.value=value;
  if(out) out.textContent=fmt(value)+(id===&#x27;Ain&#x27;||id===&#x27;Bin&#x27;?&#x27;°&#x27;:&#x27;&#x27;);
  return value;
}
[&#x27;a&#x27;,&#x27;b&#x27;,&#x27;c&#x27;,&#x27;Ain&#x27;,&#x27;Bin&#x27;].forEach(id=&gt;{
  const r=$(id), n=$(id+&#x27;n&#x27;);
  r.addEventListener(&#x27;input&#x27;,()=&gt;{ const v=setPair(id,r.value); applyInput(id,v); });
  n.addEventListener(&#x27;change&#x27;,()=&gt;{ const v=setPair(id,n.value); applyInput(id,v); });
});

function applyInput(id,v){
  if(id===&#x27;a&#x27;||id===&#x27;b&#x27;||id===&#x27;c&#x27;) state[id]=v;
  if(id===&#x27;Ain&#x27;) state.A=v;
  if(id===&#x27;Bin&#x27;) state.B=v;
  render();
}

function validSides(a,b,c){return a+b&gt;c &amp;&amp; a+c&gt;b &amp;&amp; b+c&gt;a}
function anglesFromSides(a,b,c){
  const A=deg(Math.acos(clamp((b*b+c*c-a*a)/(2*b*c),-1,1)));
  const B=deg(Math.acos(clamp((a*a+c*c-b*b)/(2*a*c),-1,1)));
  const C=180-A-B;
  return [A,B,C];
}
function sidesFromAngles(A,B,C){
  const c=9;
  const k=c/Math.sin(rad(C));
  return [k*Math.sin(rad(A)),k*Math.sin(rad(B)),c];
}
function classifySides(a,b,c){
  const eps=.0001;
  const eq=(x,y)=&gt;Math.abs(x-y)&lt;eps;
  return eq(a,b)&amp;&amp;eq(b,c)?&#x27;Equilátero&#x27;:(eq(a,b)||eq(a,c)||eq(b,c)?&#x27;Isósceles&#x27;:&#x27;Escaleno&#x27;);
}
function classifyAngles(A,B,C){
  const m=Math.max(A,B,C), eps=.0001;
  if(Math.abs(m-90)&lt;eps) return &#x27;Rectángulo&#x27;;
  return m&gt;90?&#x27;Obtusángulo&#x27;:&#x27;Acutángulo&#x27;;
}
function el(tag,attrs={},text=&#x27;&#x27;){
  const e=document.createElementNS(ns,tag);
  Object.entries(attrs).forEach(([k,v])=&gt;e.setAttribute(k,v));
  if(text)e.textContent=text;
  svg.appendChild(e);return e;
}
function pointOnArc(P,ang,r){return {x:P.x+r*Math.cos(ang),y:P.y-r*Math.sin(ang)}}
function drawArc(P,from,to,r,label){
  let d=to-from;
  while(d&lt;0)d+=Math.PI*2;
  if(d&gt;Math.PI){const t=from;from=to;to=t;d=Math.PI*2-d}
  const p1=pointOnArc(P,from,r), p2=pointOnArc(P,to,r);
  el(&#x27;path&#x27;,{d:`M ${p1.x} ${p1.y} A ${r} ${r} 0 0 0 ${p2.x} ${p2.y}`,class:&#x27;arc&#x27;});
  const mid=from+d/2, lp=pointOnArc(P,mid,r+19);
  el(&#x27;text&#x27;,{x:lp.x,y:lp.y,class:&#x27;label angleLabel&#x27;,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},label);
}
function drawTriangle(a,b,c,A,B,C){
  svg.replaceChildren();
  const left=80,right=510,baseY=300;
  const scale=430/c;
  const x=(b*b+c*c-a*a)/(2*c);
  const h=Math.sqrt(Math.max(0,b*b-x*x));
  let rawA={x:0,y:0}, rawB={x:c,y:0}, rawC={x:x,y:h};
  const maxH=Math.max(h,0.001);
  const s=Math.min(scale,235/maxH);
  const width=c*s, offsetX=(590-width)/2;
  const P={x:offsetX,y:baseY}, Q={x:offsetX+c*s,y:baseY}, R={x:offsetX+x*s,y:baseY-h*s};

  el(&#x27;line&#x27;,{x1:P.x,y1:P.y,x2:Q.x,y2:Q.y,stroke:&#x27;#ad5c18&#x27;,class:&#x27;side&#x27;});
  el(&#x27;line&#x27;,{x1:Q.x,y1:Q.y,x2:R.x,y2:R.y,stroke:&#x27;#245bcb&#x27;,class:&#x27;side&#x27;});
  el(&#x27;line&#x27;,{x1:R.x,y1:R.y,x2:P.x,y2:P.y,stroke:&#x27;#087e91&#x27;,class:&#x27;side&#x27;});

  [[P,&#x27;A&#x27;],[Q,&#x27;B&#x27;],[R,&#x27;C&#x27;]].forEach(([p,n])=&gt;{
    el(&#x27;circle&#x27;,{cx:p.x,cy:p.y,r:6,class:&#x27;vertex&#x27;});
    el(&#x27;text&#x27;,{x:p.x+(n===&#x27;B&#x27;?12:-12),y:p.y+(n===&#x27;C&#x27;?-12:22),class:&#x27;label&#x27;,&#x27;text-anchor&#x27;:n===&#x27;B&#x27;?&#x27;start&#x27;:&#x27;end&#x27;},n);
  });

  const mid=(U,V)=&gt;({x:(U.x+V.x)/2,y:(U.y+V.y)/2});
  let m=mid(Q,R); el(&#x27;text&#x27;,{x:m.x+14,y:m.y-8,class:&#x27;label sideLabel&#x27;,fill:&#x27;#245bcb&#x27;},&#x27;a = &#x27;+fmt(a));
  m=mid(P,R); el(&#x27;text&#x27;,{x:m.x-14,y:m.y-8,class:&#x27;label sideLabel&#x27;,fill:&#x27;#087e91&#x27;,&#x27;text-anchor&#x27;:&#x27;end&#x27;},&#x27;b = &#x27;+fmt(b));
  m=mid(P,Q); el(&#x27;text&#x27;,{x:m.x,y:m.y+25,class:&#x27;label sideLabel&#x27;,fill:&#x27;#ad5c18&#x27;,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},&#x27;c = &#x27;+fmt(c));

  const ang=(O,T)=&gt;Math.atan2(O.y-T.y,T.x-O.x);
  drawArc(P,ang(P,Q),ang(P,R),32,&#x27;A &#x27;+fmt(A)+&#x27;°&#x27;);
  drawArc(Q,ang(Q,R),ang(Q,P),32,&#x27;B &#x27;+fmt(B)+&#x27;°&#x27;);
  drawArc(R,ang(R,P),ang(R,Q),32,&#x27;C &#x27;+fmt(C)+&#x27;°&#x27;);
}
function render(){
  let a,b,c,A,B,C,valid=true;
  if(mode===&#x27;sides&#x27;){
    ({a,b,c}=state);
    valid=validSides(a,b,c);
    if(valid){[A,B,C]=anglesFromSides(a,b,c)}
  }else{
    A=state.A;B=state.B;C=180-A-B;
    valid=C&gt;=5;
    $(&#x27;Ccalc&#x27;).textContent=fmt(C)+&#x27;°&#x27;;
    $(&#x27;Cnum&#x27;).value=fmt(C);
    if(valid){[a,b,c]=sidesFromAngles(A,B,C)}
  }

  const st=$(&#x27;status&#x27;);
  if(!valid){
    svg.replaceChildren();
    el(&#x27;text&#x27;,{x:295,y:165,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,fill:&#x27;#b42318&#x27;,&#x27;font-size&#x27;:18,&#x27;font-weight&#x27;:800},mode===&#x27;sides&#x27;?&#x27;Estas longitudes no forman un triángulo&#x27;:&#x27;A + B debe ser menor que 175°&#x27;);
    el(&#x27;text&#x27;,{x:295,y:195,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,fill:&#x27;#536680&#x27;,&#x27;font-size&#x27;:13},mode===&#x27;sides&#x27;?&#x27;Ajusta uno de los lados para cumplir la desigualdad triangular.&#x27;:&#x27;Reduce A o B para que el tercer ángulo sea al menos 5°.&#x27;);
    st.className=&#x27;status bad&#x27;;
    st.textContent=mode===&#x27;sides&#x27;?&#x27;No existe: cada lado debe ser menor que la suma de los otros dos.&#x27;:&#x27;Combinación no válida: los tres ángulos interiores deben ser positivos y sumar 180°.&#x27;;
    [&#x27;sides&#x27;,&#x27;angles&#x27;,&#x27;sideType&#x27;,&#x27;angleType&#x27;,&#x27;perimeter&#x27;,&#x27;sum&#x27;].forEach(id=&gt;$(id).textContent=&#x27;—&#x27;);
    $(&#x27;ineq&#x27;).innerHTML=mode===&#x27;sides&#x27;?`&lt;span class=&quot;formula-line&quot;&gt;a + b &gt; c: ${fmt(a+b)} &gt; ${fmt(c)}&lt;/span&gt;&lt;span class=&quot;formula-line&quot;&gt;a + c &gt; b: ${fmt(a+c)} &gt; ${fmt(b)}&lt;/span&gt;&lt;span class=&quot;formula-line&quot;&gt;b + c &gt; a: ${fmt(b+c)} &gt; ${fmt(a)}&lt;/span&gt;`:&#x27;Los ángulos deben ser mayores que 0° y sumar 180°.&#x27;;
    $(&#x27;sumEq&#x27;).textContent=&#x27;A + B + C = 180.0000°&#x27;;
    return;
  }
  st.className=&#x27;status ok&#x27;;
  st.textContent=mode===&#x27;sides&#x27;?&#x27;Sí existe: las tres desigualdades triangulares se cumplen.&#x27;:&#x27;Triángulo válido: el tercer ángulo se determina automáticamente.&#x27;;
  drawTriangle(a,b,c,A,B,C);
  $(&#x27;sides&#x27;).innerHTML=`&lt;span class=&quot;formula-line&quot;&gt;a = ${fmt(a)} u&lt;/span&gt;&lt;span class=&quot;formula-line&quot;&gt;b = ${fmt(b)} u&lt;/span&gt;&lt;span class=&quot;formula-line&quot;&gt;c = ${fmt(c)} u&lt;/span&gt;`;
  $(&#x27;angles&#x27;).innerHTML=`&lt;span class=&quot;formula-line&quot;&gt;A = ${fmt(A)}°&lt;/span&gt;&lt;span class=&quot;formula-line&quot;&gt;B = ${fmt(B)}°&lt;/span&gt;&lt;span class=&quot;formula-line&quot;&gt;C = ${fmt(C)}°&lt;/span&gt;`;
  $(&#x27;sideType&#x27;).textContent=classifySides(a,b,c);
  $(&#x27;angleType&#x27;).textContent=classifyAngles(A,B,C);
  $(&#x27;perimeter&#x27;).textContent=fmt(a+b+c)+&#x27; u&#x27;;
  $(&#x27;sum&#x27;).textContent=fmt(A+B+C)+&#x27;°&#x27;;
  $(&#x27;ineq&#x27;).innerHTML=`&lt;span class=&quot;formula-line&quot;&gt;a + b &gt; c: ${fmt(a+b)} &gt; ${fmt(c)}&lt;/span&gt;&lt;span class=&quot;formula-line&quot;&gt;a + c &gt; b: ${fmt(a+c)} &gt; ${fmt(b)}&lt;/span&gt;&lt;span class=&quot;formula-line&quot;&gt;b + c &gt; a: ${fmt(b+c)} &gt; ${fmt(a)}&lt;/span&gt;`;
  $(&#x27;sumEq&#x27;).textContent=`${fmt(A)}° + ${fmt(B)}° + ${fmt(C)}° = 180.0000°`;
}
function setMode(next){
  mode=next;
  $(&#x27;modeSides&#x27;).setAttribute(&#x27;aria-pressed&#x27;,String(mode===&#x27;sides&#x27;));
  $(&#x27;modeAngles&#x27;).setAttribute(&#x27;aria-pressed&#x27;,String(mode===&#x27;angles&#x27;));
  $(&#x27;sideControls&#x27;).classList.toggle(&#x27;hidden&#x27;,mode!==&#x27;sides&#x27;);
  $(&#x27;angleControls&#x27;).classList.toggle(&#x27;hidden&#x27;,mode!==&#x27;angles&#x27;);
  $(&#x27;modeNote&#x27;).textContent=mode===&#x27;sides&#x27;
    ?&#x27;En este modo controlas las tres longitudes. El simulador verifica automáticamente la desigualdad triangular.&#x27;
    :&#x27;En este modo controlas A y B. El ángulo C se calcula porque A + B + C = 180°. La escala del dibujo se fija con c = 9.0000 u.&#x27;;
  render();
}
$(&#x27;modeSides&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;setMode(&#x27;sides&#x27;));
$(&#x27;modeAngles&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;setMode(&#x27;angles&#x27;));

document.querySelectorAll(&#x27;[data-preset]&#x27;).forEach(btn=&gt;btn.addEventListener(&#x27;click&#x27;,()=&gt;{
  const p=btn.dataset.preset;
  setMode(&#x27;sides&#x27;);
  const vals={
    equilateral:[8,8,8],
    isosceles:[7,7,10],
    scalene:[6,8,10],
    right:[6,8,10],
    obtuse:[5,6,9]
  }[p];
  [&#x27;a&#x27;,&#x27;b&#x27;,&#x27;c&#x27;].forEach((id,i)=&gt;{state[id]=setPair(id,vals[i])});
  render();
}));
render();
})();
&lt;/script&gt;

  if(&#x27;ResizeObserver&#x27; in window)new ResizeObserver(report).observe(document.body);
  addEventListener(&#x27;resize&#x27;,report);

(()=>{const buttons=Array.from(document.querySelectorAll('[role=tab]'));const panels=Array.from(document.querySelectorAll('.tabPanel'));function activate(index){buttons.forEach((b,i)=>{b.setAttribute('aria-selected',String(i===index));b.tabIndex=i===index?0:-1;panels[i].hidden=i!==index});requestAnimationFrame(()=>{const f=panels[index].querySelector('iframe');f.contentWindow.postMessage({pedirAltura:true},'*')})}buttons.forEach((btn,i)=>{btn.addEventListener('click',()=>activate(i));btn.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let n=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;activate(n);buttons[n].focus()})});window.addEventListener('message',e=>{const iframe=Array.from(document.querySelectorAll('iframe')).find(f=>f.contentWindow===e.source);if(!iframe||!e.data||typeof e.data.laboratorioAltura!=='number')return;const h=Math.min(3200,Math.max(280,e.data.laboratorioAltura+3));iframe.style.height=h+'px'});})();
